{% extends "base.html" %}

{% block content %}
    <main class="container">
        <div class="row d-flex justify-content-between">
            {% include "search_bar.html" %}
            {% include "bin.html" %}
        </div>
        <div class="cards-wrapper">
            {% for element in elements %}
                <div class="card">
                    <img src="{{ element.image.url }}" class="element-preview" alt=""/>
                    <div class="card-body" >
                        <div class="card-info">
                            <h5 class="card-title">{{ element.name }}</h5>
                            <p class="card-text">Химическая формула: {{ element.formula }} </p>
                        </div>
                        <div class="row card-btns">
                            <div class="col d-flex justify-content-center flex-grow-1">
                                <a href="/elements/{{ element.id }}" class="btn btn-primary">
                                    Открыть
                                </a>
                            </div>
                            <form method="post" action="{% url 'add_element_to_draft_calculation' element.id %}" class="col d-flex justify-content-center">
                                {% csrf_token %}
                                <input type="hidden" name="element_name" value="{{ element_name }}">
                                <button class="add-btn btn btn-secondary" type="submit">
                                    Добавить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock content %}
