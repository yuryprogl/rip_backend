{% extends "base.html" %}
{% load static %}

{% block content %}
    <main class="container">
        <h3  class="text-center">Черновой расчет растворимости</h3>
        <div class="form-group">
            <label class="form-label">Обьем воды (мл)</label>
            <input disabled class="form-control" style="width: 150px" value="{{ calculation.volume }}">
        </div>

        <h4 class="text-center">Химические соединения</h4>
        <div class="cards-wrapper d-flex flex-column">
            {% for element in elements %}
                <div class="card w-100 mb5">
                     <div class="row g-0">
                        <div class="col-md-6 d-flex justify-center">
                            <img src="{{ element.image }}" />
                        </div>
                        <div class="col-md-3 d-flex">
                            <div class="card-body">
                                <h5 class="card-title">{{ element.name }} </h5>
                                <p class="card-text">Химическая формула: {{ element.formula }} </p>
                                <a href="/elements/{{ element.id }}/" class="btn btn-primary" style="width: 110px">
                                    Подробнее
                                </a>
                            </div>
                        </div>
                        <div class="col-md-3 d-flex">
                            <div class="card-body">
                                <div class="form-group">
                                    <label class="form-label">Температура (°C)</label>
                                    <input disabled class="form-control" style="width: 150px" value="{{ element.temperature }}">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Масса (мг)</label>
                                    <input disabled class="form-control" style="width: 150px" value="">
                                </div>
                            </div>
                        </div>
                     </div>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock content %}
